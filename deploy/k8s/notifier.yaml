apiVersion: v1
kind: ConfigMap
metadata:
  name: notifier-config
  namespace: messenger
data:
  KAFKA_BROKERS: kafka:9092
  KAFKA_CONSUMER_GROUP: notifier
  LOG_LEVEL: info
  RETRY_DELAY: 1s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: messenger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notifier
  template:
    metadata:
      labels:
        app: notifier
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: notifier
          image: messenger/notifier:0.1.0
          envFrom:
            - configMapRef:
                name: notifier-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notifier-db
                  key: password
            - name: DATABASE_URL
              value: postgres://notifier:$(DB_PASSWORD)@notifier-postgres:5432/notifier?sslmode=disable
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
