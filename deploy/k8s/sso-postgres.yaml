apiVersion: v1
kind: Service
metadata:
  name: sso-postgres
  namespace: messenger
spec:
  clusterIP: None
  selector:
    app: sso-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sso-postgres
  namespace: messenger
spec:
  serviceName: sso-postgres
  replicas: 1
  selector:
    matchLabels:
      app: sso-postgres
  template:
    metadata:
      labels:
        app: sso-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: sso
            - name: POSTGRES_USER
              value: sso
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sso-db
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sso", "-d", "sso"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi