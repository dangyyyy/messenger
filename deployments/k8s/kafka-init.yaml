apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  namespace: messenger
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:4.2.0
          command:
            - /opt/kafka/bin/kafka-topics.sh
            - --bootstrap-server
            - kafka:9092
            - --create
            - --if-not-exists
            - --topic
            - users.registered
            - --partitions
            - "3"
            - --replication-factor
            - "1"
