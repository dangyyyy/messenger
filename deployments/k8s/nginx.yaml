apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: messenger
spec:
  selector:
    app: nginx
  ports:
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: messenger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          env:
            - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
              value: "1"
            # resolver nginx не знает про search-домены, поэтому полное имя
            - name: SSO_HOST
              value: sso-headless.messenger.svc.cluster.local
            - name: CHAT_HOST
              value: chat.messenger.svc.cluster.local
            - name: GATEWAY_HOST
              value: gateway.messenger.svc.cluster.local
          ports:
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: templates
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: certs
              mountPath: /etc/nginx/certs
              readOnly: true
            - name: web
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: templates
          configMap:
            name: nginx-templates
        - name: certs
          secret:
            secretName: nginx-tls
        - name: web
          configMap:
            name: nginx-web
