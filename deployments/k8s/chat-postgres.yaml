apiVersion: v1
kind: Service
metadata:
  name: chat-postgres
  namespace: messenger
spec:
  clusterIP: None
  selector:
    app: chat-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chat-postgres
  namespace: messenger
spec:
  serviceName: chat-postgres
  replicas: 1
  selector:
    matchLabels:
      app: chat-postgres
  template:
    metadata:
      labels:
        app: chat-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: chat
            - name: POSTGRES_USER
              value: chat
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-db
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "chat", "-d", "chat"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
