apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: messenger
data:
  HTTP_PORT: "8080"
  # Headless-имена: gRPC-клиент gateway сам раскидывает запросы по подам (round_robin)
  SSO_ADDR: sso-headless:50051
  CHAT_ADDR: chat:50052
  LOG_LEVEL: info
  REQUEST_TIMEOUT: 5s
  SHUTDOWN_TIMEOUT: 10s
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: messenger
spec:
  clusterIP: None
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: messenger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: messenger/gateway:0.1.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
