services:
  sso-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sso
      POSTGRES_USER: sso
      POSTGRES_PASSWORD: ${SSO_DB_PASSWORD}
    ports:
      - "${SSO_DB_PORT:-5433}:5432"
    volumes:
      - sso_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso -d sso"]
      interval: 5s
      timeout: 5s
      retries: 10

  notifier-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: notifier
      POSTGRES_USER: notifier
      POSTGRES_PASSWORD: ${NOTIFIER_DB_PASSWORD}
    ports:
      - "${NOTIFIER_DB_PORT:-5434}:5432"
    volumes:
      - notifier_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifier -d notifier"]
      interval: 5s
      timeout: 5s
      retries: 10

  chat-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD}
    ports:
      - "${CHAT_DB_PORT:-5435}:5432"
    volumes:
      - chat_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:4.2.0
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --create --if-not-exists --topic users.registered
      --partitions 3 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_healthy

  sso:
    build:
      context: .
      dockerfile: build/package/sso/Dockerfile
    environment:
      DATABASE_URL: postgres://sso:${SSO_DB_PASSWORD}@sso-postgres:5432/sso?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: kafka:9092
      GRPC_PORT: "50051"
      GRPC_REFLECTION: "true"
      APP_SECRET: ${APP_SECRET}
    deploy:
      replicas: 2
    depends_on:
      sso-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s

  notifier:
    build:
      context: .
      dockerfile: build/package/notifier/Dockerfile
    environment:
      DATABASE_URL: postgres://notifier:${NOTIFIER_DB_PASSWORD}@notifier-postgres:5432/notifier?sslmode=disable
      KAFKA_BROKERS: kafka:9092
    depends_on:
      notifier-postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s

  chat:
    build:
      context: .
      dockerfile: build/package/chat/Dockerfile
    environment:
      DATABASE_URL: postgres://chat:${CHAT_DB_PASSWORD}@chat-postgres:5432/chat?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: kafka:9092
      APP_SECRET: ${APP_SECRET}
      GRPC_REFLECTION: "true"
    deploy:
      replicas: 2
    depends_on:
      chat-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s

  gateway:
    build:
      context: .
      dockerfile: build/package/gateway/Dockerfile
    environment:
      SSO_ADDR: sso:50051
      CHAT_ADDR: chat:50052
    depends_on:
      - sso
      - chat
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      SSO_HOST: sso
      CHAT_HOST: chat
      GATEWAY_HOST: gateway
    ports:
      - "${NGINX_PORT:-8443}:8443"
    volumes:
      - ./deployments/nginx/templates:/etc/nginx/templates:ro
      - ./deployments/nginx/certs:/etc/nginx/certs:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - sso
      - chat
      - gateway
    restart: unless-stopped

volumes:
  sso_postgres_data:
  notifier_postgres_data:
  chat_postgres_data:
  kafka_data: